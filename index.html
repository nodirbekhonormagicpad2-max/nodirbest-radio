<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#11091e">
<meta name="description" content="NodirBest Radio — the greatest English-language hits of all time, streaming live 24/7.">
<title>NodirBest Radio — All Time Hits</title>
<style>
:root{color-scheme:dark;--pink:#ff398a;--lav:#c49aff}*{box-sizing:border-box}body{margin:0;min-height:100svh;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#0b0713}.player{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 30px;background:radial-gradient(ellipse at 50% 8%,#50246c 0%,#20122f 43%,#0b0713 85%)}.topline{width:min(100%,560px);display:flex;align-items:center;justify-content:space-between;gap:12px;color:#dfc5f5;font-size:11px;font-weight:750;letter-spacing:.16em}.topline .tag{border:1px solid #ffffff30;border-radius:999px;padding:8px 12px;background:#ffffff0d}.now{text-align:center;width:min(100%,560px);padding:32px 0 22px}.eyebrow{margin:0 0 13px;color:#d3a8ff;font-size:11px;letter-spacing:.3em;font-weight:800}.eyebrow:before{content:'●';color:var(--pink);margin-right:10px}h1{margin:0 0 9px;font-size:clamp(27px,7vw,48px);line-height:1.13;letter-spacing:-.04em;overflow-wrap:anywhere}#song{margin:0;color:#eadcf4;font-size:clamp(16px,4.5vw,24px);overflow-wrap:anywhere}.art-wrap{width:min(100%,520px)}.art{width:100%;aspect-ratio:1;position:relative;overflow:hidden;border-radius:25px;background:linear-gradient(135deg,#35204d,#180d27);box-shadow:0 25px 65px #0008,0 0 0 1px #ffffff1c}.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s ease}.art img.visible{opacity:1}.placeholder{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(70px,20vw,130px);color:#ffffff3d}.controls{width:min(100%,520px);display:flex;flex-direction:column;gap:18px;margin-top:20px}.glass{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:9px;padding:13px 12px;border-radius:25px;border:1px solid #ffffff36;background:linear-gradient(120deg,#b38bff2c,#ffffff0c);box-shadow:0 14px 35px #0005,inset 0 1px #ffffff20;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}.brand{font-size:clamp(10px,2.9vw,16px);font-weight:900;letter-spacing:.04em;line-height:1.35}.play{border:0;width:clamp(70px,19vw,92px);height:clamp(70px,19vw,92px);border-radius:50%;background:linear-gradient(135deg,#8066ff,#bf2dea);color:white;font-size:38px;box-shadow:0 10px 36px #9c39ed80;cursor:pointer}.play:active{transform:scale(.97)}.live{justify-self:end;border-radius:999px;background:#fa246c;padding:10px 11px;font-size:clamp(10px,2.8vw,14px);font-weight:850;white-space:nowrap;letter-spacing:.05em}.live i{font-style:normal;font-size:10px}.lower{display:flex;align-items:center;justify-content:space-between;gap:12px}.volume{display:flex;align-items:center;gap:10px;min-width:0;flex:1}.volume label{font-size:21px}.volume input{width:100%;accent-color:#b88aff}.share{border:1px solid #ffffff3b;background:#ffffff15;color:#fff;border-radius:14px;padding:12px 15px;font-weight:750;cursor:pointer}.quality{text-align:center;color:#cbb2df;letter-spacing:.18em;font-size:11px;font-weight:750}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}@media(max-width:360px){.player{padding-inline:12px}.glass{padding:10px 8px;gap:5px}.live{padding:9px 7px}.brand{letter-spacing:0}.now{padding-top:25px}}
/* Desktop only: zoom album artwork to crop embedded colored sidebars. Mobile unchanged. */
@media (min-width:800px){.art img{transform:scale(1.35);transform-origin:center center}}
</style>
</head>
<body>
<main class="player">
<div class="topline"><span>ALL TIME HITS</span><span class="tag">24 / 7 ONLINE RADIO</span></div>
<section class="now" aria-label="Now playing"><p class="eyebrow">NOW PLAYING</p><h1 id="artist">NodirBest Radio</h1><p id="song">The Greatest Hits of All Time</p></section>
<section class="art-wrap" aria-label="Album artwork"><div class="art"><div class="placeholder" id="placeholder">♫</div><img id="artwork" alt="Current song album artwork"></div></section>
<section class="controls"><div class="glass"><div class="brand">NODIRBEST<br>RADIO</div><button class="play" id="play" aria-label="Play radio">▶</button><div class="live"><i>●</i> LIVE</div></div><div class="lower"><div class="volume"><label for="volume">🔊</label><input id="volume" type="range" min="0" max="100" value="75" aria-label="Volume"></div><button class="share" id="share" type="button">↗ Share</button></div><div class="quality">192 KBPS · LIVE STREAM</div><div class="sr-only" id="status" role="status" aria-live="polite">Press Play to listen live</div></section>
</main>
<audio id="audio" preload="none" src="https://a8.asurahosting.com:8050/radio.mp3"></audio>
<script>
'use strict';
const audio=document.getElementById('audio');
const play=document.getElementById('play');
const status=document.getElementById('status');
const artistEl=document.getElementById('artist');
const songEl=document.getElementById('song');
const artworkEl=document.getElementById('artwork');
const placeholder=document.getElementById('placeholder');
const volume=document.getElementById('volume');
const share=document.getElementById('share');
const FALLBACK_TITLE='NodirBest Radio';
let currentKey='',currentImage='',imageRequest=0,polling=false,pollTimer=null;
audio.volume=.75;
function updateMediaSession(){
 if(!('mediaSession' in navigator)||!('MediaMetadata' in window))return;
 const art=artworkEl.classList.contains('visible')&&artworkEl.getAttribute('src')?artworkEl.src:null;
 navigator.mediaSession.metadata=new MediaMetadata({title:songEl.textContent.trim()||FALLBACK_TITLE,artist:artistEl.textContent.trim()||FALLBACK_TITLE,album:'NodirBest Radio — All Time Hits',artwork:art?[{src:art}]:[]});
 navigator.mediaSession.playbackState=audio.paused?'paused':'playing';
}
if('mediaSession' in navigator){
 try{navigator.mediaSession.setActionHandler('play',()=>{audio.play().catch(()=>{status.textContent='Unable to play';});});}catch{}
 try{navigator.mediaSession.setActionHandler('pause',()=>audio.pause());}catch{}
}
play.addEventListener('click',async()=>{if(!audio.paused){audio.pause();return;}status.textContent='Connecting…';try{await audio.play();}catch{status.textContent='Unable to play. Tap again.';}});
audio.addEventListener('playing',()=>{play.textContent='Ⅱ';play.setAttribute('aria-label','Pause radio');status.textContent='You are listening live';updateMediaSession();startMetadataUpdates();});
audio.addEventListener('pause',()=>{play.textContent='▶';play.setAttribute('aria-label','Play radio');status.textContent='Paused';updateMediaSession();if(document.hidden)stopMetadataUpdates();});
audio.addEventListener('error',()=>{status.textContent='Stream unavailable';});
volume.addEventListener('input',()=>{audio.volume=Number(volume.value)/100;});
share.addEventListener('click',async()=>{const data={title:'NodirBest Radio — All Time Hits',text:'Listen to NodirBest Radio live, 24/7!',url:location.origin+location.pathname};try{if(navigator.share){await navigator.share(data);}else if(navigator.clipboard){await navigator.clipboard.writeText(data.url);status.textContent='Radio link copied';share.textContent='✓ Copied';setTimeout(()=>share.textContent='↗ Share',1800);}else{prompt('Copy radio link:',data.url);}}catch(e){if(e.name!=='AbortError')status.textContent='Could not share';}});
function setArtwork(url){const request=++imageRequest;currentImage=url||'';if(!url){artworkEl.classList.remove('visible');artworkEl.removeAttribute('src');placeholder.style.display='grid';updateMediaSession();return;}const next=new Image();next.onload=()=>{if(request!==imageRequest)return;artworkEl.src=url;placeholder.style.display='none';artworkEl.classList.add('visible');updateMediaSession();};next.onerror=()=>{if(request!==imageRequest)return;artworkEl.classList.remove('visible');artworkEl.removeAttribute('src');placeholder.style.display='grid';updateMediaSession();};next.src=url;}
async function poll(){if(polling)return;polling=true;try{const response=await fetch('/.netlify/functions/nowplaying',{cache:'no-store'});if(!response.ok)throw new Error('Metadata unavailable');const data=await response.json();if(data.artist&&data.song){const key=data.artist+'|'+data.song;const image=typeof data.image==='string'?data.image:null;if(key!==currentKey){currentKey=key;artistEl.textContent=data.artist;songEl.textContent=data.song;updateMediaSession();}if(image!==currentImage)setArtwork(image);}}catch(error){console.warn('Now playing:',error.message);}finally{polling=false;}}
// Polling in background is best-effort: Android/iOS may throttle suspended tabs.
const POLL_INTERVAL_MS=60000;
function startMetadataUpdates(){if(document.hidden&&audio.paused)return;if(pollTimer===null){poll();pollTimer=setInterval(()=>{if(!document.hidden||!audio.paused)poll();},POLL_INTERVAL_MS);}}
function stopMetadataUpdates(){if(pollTimer!==null){clearInterval(pollTimer);pollTimer=null;}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden||!audio.paused)startMetadataUpdates();else stopMetadataUpdates();});
updateMediaSession();startMetadataUpdates();
</script>
</body></html>
