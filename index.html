<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NodirBest Radio — LIVE</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,Arial,sans-serif;background:#100d1e;color:white}
.hero{min-height:100svh;position:relative;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background:radial-gradient(circle at 50% 35%,#57368a,#171124 70%)}
/* Two independent image layers: blurred full-screen fill + uncropped foreground. */
.backdrop-blur,.backdrop{position:absolute;inset:0;pointer-events:none;background-repeat:no-repeat;background-position:center;transition:background-image .7s}
.backdrop-blur{inset:-35px;background-size:cover;filter:blur(30px) brightness(.55);opacity:.85}
.backdrop{background-size:contain;opacity:.94}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(7,5,16,.7),rgba(7,5,16,.08) 38%,rgba(7,5,16,.55) 70%,rgba(9,7,19,.78))}
header,.content{position:relative;z-index:1}
header{display:flex;justify-content:space-between;align-items:center;padding:28px 23px;font-weight:800;letter-spacing:2px;font-size:clamp(15px,4vw,23px);gap:12px}
.live{flex-shrink:0;background:#ff2263;padding:11px 17px;border-radius:30px;font-size:13px;letter-spacing:1px}
.content{text-align:center;padding:12px 24px 38px}
.eyebrow{letter-spacing:4px;font-size:13px;color:#d8c9ff;font-weight:700}
h1{font-size:clamp(32px,8vw,55px);margin:15px 0 6px;text-shadow:0 3px 22px #000}
#song{font-size:clamp(17px,4vw,24px);margin:0 0 25px;color:#eee;text-shadow:0 2px 12px #000}
.play{width:100px;height:100px;border:0;border-radius:50%;font-size:39px;color:white;background:linear-gradient(140deg,#7963ff,#a824db);box-shadow:0 0 38px #8746e66b;cursor:pointer}
.volume{display:flex;align-items:center;gap:16px;justify-content:center;margin:28px auto;max-width:380px}
.volume input{width:100%;accent-color:#aa7bff}
#status{font-size:14px;color:#ddd;min-height:22px}
.small{font-size:12px;letter-spacing:2px;color:#c8b8dc;margin-top:20px}
#credit{font-size:11px;color:#ddd}
a{color:#ded0ff}
</style>
</head>
<body>
<main class="hero">
  <div class="backdrop-blur" id="backdropBlur"></div>
  <div class="backdrop" id="backdrop"></div>
  <div class="shade"></div>
  <header><span>NODIRBEST RADIO</span><span class="live">● LIVE</span></header>
  <section class="content">
    <div class="eyebrow">NOW PLAYING</div>
    <h1 id="artist">NodirBest Radio</h1>
    <p id="song">Your music, your vibe</p>
    <button class="play" id="play" aria-label="Play radio">▶</button>
    <div class="volume"><span>🔊</span><input id="volume" type="range" min="0" max="100" value="75" aria-label="Volume"></div>
    <div id="status">Press Play to listen live</div>
    <div id="credit"></div>
    <div class="small">192 KBPS · LIVE STREAM</div>

  </section>
</main>
<audio id="audio" preload="none" src="https://stream.volnorez.com/live-app/927955?br=192"></audio>
<script>
const audio=document.getElementById('audio');
const play=document.getElementById('play');
const status=document.getElementById('status');
audio.volume=.75;
play.onclick=async()=>{
  if(!audio.paused){audio.pause();return}
  status.textContent='Connecting…';
  try{await audio.play()}catch(e){status.textContent='Could not start audio. Tap Play again.'}
};
audio.onplaying=()=>{play.textContent='Ⅱ';status.textContent='You are listening live'};
audio.onpause=()=>{play.textContent='▶';status.textContent='Paused'};
audio.onerror=()=>{status.textContent='Stream unavailable. Please try again.'};
document.getElementById('volume').oninput=e=>audio.volume=Number(e.target.value)/100;
let last='',polling=false,imageVersion=0;
const foreground=document.getElementById('backdrop');
const background=document.getElementById('backdropBlur');
const credit=document.getElementById('credit');

async function showImage(url, type, version){
  if(!url){
    if(version===imageVersion){
      foreground.style.backgroundImage='none';
      background.style.backgroundImage='none';
      credit.textContent='Artwork unavailable';
    }
    return;
  }
  const img=new Image();
  img.onload=()=>{
    if(version!==imageVersion)return;
    const cssUrl='url('+JSON.stringify(url)+')';
    foreground.style.backgroundImage=cssUrl;
    background.style.backgroundImage=cssUrl;
    credit.textContent=type==='artist'?'Artist image':'Album artwork';
  };
  img.onerror=()=>{
    if(version===imageVersion)credit.textContent='Artwork unavailable';
  };
  img.src=url;
}

async function poll(){
  if(polling || document.hidden)return;
  polling=true;
  try{
    const r=await fetch('/.netlify/functions/nowplaying',{cache:'no-store'});
    if(!r.ok)throw Error('Metadata unavailable');
    const d=await r.json();
    if(d.artist && d.song){
      const key=d.artist+'|'+d.song;
      if(key!==last){
        last=key;
        const version=++imageVersion;
        document.getElementById('artist').textContent=d.artist;
        document.getElementById('song').textContent=d.song;
        credit.textContent='Loading artwork…';
        // Use artwork returned by AudD immediately; no extra server request.
        if(d.image){showImage(d.image,d.imageType,version)}
        else{
          const url='/.netlify/functions/nowplaying?artist='+encodeURIComponent(d.artist)+'&song='+encodeURIComponent(d.song);
          fetch(url,{cache:'no-store'}).then(x=>x.json()).then(x=>showImage(x.image,x.imageType,version)).catch(()=>showImage(null,null,version));
        }
      }
    }
  }catch(e){console.warn('Now playing:',e.message)}
  finally{polling=false}
}
poll();setInterval(poll,3000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
</script>
</body>
</html>
